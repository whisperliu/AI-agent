# dsh-price-agent —— plugin injection layer.
# Applied after bundle layers, before the profile's own cordis.patch.yml.
# Registers the price_agent tool plugin into the profile.
#
# P1: real config (device/task/evidence/ocr/platforms). Fields follow §4.3 / §5.1.

- insert:
    - id: price-agent
      name: 'dsh-price-agent'
      config:
        device:
          driver: mock # mock | adb  (P2：真机把 driver 设为 adb，serial 填 host:port 或 auto)
          serial: auto
          adbPath: adb # adb 可执行文件路径（默认走 PATH；无系统 adb 时填 platform-tools 绝对路径）
          autoReconnect: true # 掉线自动 adb connect 重连一次（§8.3）
        task:
          stepTimeoutMs: 8000
          pageTimeoutMs: 20000
          taskTimeoutMs: 90000
          lockWaitMs: 5000 # 锁等待上限；超时 → 503 BUSY（§7.7 R4）
          idempotencyTtlMinutes: 30
          retryAttempts: 2 # P5：仅瞬时故障重试；验证码/支付绝不重试
        evidence:
          ttlMinutes: 10
          retainMax: 50
          retainDays: 7 # P5：与 retainMax 取先到者清理
          redact: true # P5：截图默认脱敏，无法脱敏则不落图
        ocr:
          enabled: false # P1: MockOcr only
        platforms:
          meituan:
            enabled: true
            appId: com.sankuai.meituan
            priceToleranceYuan: 1.0
            # 平台级优惠策略（§5.1）：只有结算页实时实证(verified)且未含在实付才扣 effectivePrice。
            strategies:
              - id: meituan-shenquan
                kind: membership
                name: 美团神券 满30减5
                condition: { minSpend: 30 }
                discount: { type: fixed, amount: 5 }
                autoApplied: true # 结算页默认已抵扣 → alreadyIncludedInPayable=true
                crossPlatformExclusive: false
              - id: cmb-wednesday
                kind: credit_card
                name: 招商银行 周三满50减10
                condition: { minSpend: 50, weekday: wednesday }
                discount: { type: fixed, amount: 10 }
                autoApplied: false # 需切卡，未验证不计入主价
                quota: { dailyLimit: 1, monthlyLimit: 4, totalQuota: null, lastUsedAt: null }
                exclusiveGroup: meituan-pay-activity
                crossPlatformExclusive: false # 同卡跨平台默认不互斥（§5.6）
          eleme:
            enabled: true
            appId: me.ele
            priceToleranceYuan: 1.0
            strategies:
              - id: eleme-cmb-wednesday
                kind: credit_card
                name: 招商银行 周三满50减10
                condition: { minSpend: 50, weekday: wednesday }
                discount: { type: fixed, amount: 10 }
                autoApplied: false
                quota: { dailyLimit: 1, monthlyLimit: 4, totalQuota: null, lastUsedAt: null }
                exclusiveGroup: eleme-pay-activity
                crossPlatformExclusive: false
